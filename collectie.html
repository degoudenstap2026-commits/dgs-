<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Onze Collectie</title><link rel="stylesheet" href="style.css"></head><body><header><div class="container nav"><a class="brand" href="index.html"><span class="logo">GS</span><span><strong data-site-name>De Gouden Stap</strong><small data-tagline></small></span></a><nav class="menu"><a href="index.html">Home</a><a class="active" href="collectie.html">Onze Collectie</a><a href="categorieen.html">Categorieën</a><a href="admin.html">Beheer</a></nav></div></header><section class="pagehead"><div class="container"><div class="eyebrow">ONZE COLLECTIE</div><h1>Vind jouw volgende stap</h1><p>Blader door de volledige collectie.</p></div></section><main class="container collection"><div class="filters" id="filters"></div><div class="slider"><button class="arrow prev" onclick="move(-1)">‹</button><img id="slide"><button class="arrow next" onclick="move(1)">›</button></div><div class="product-title"><div class="eyebrow" id="pcat"></div><h2 id="pname"></h2><div id="count"></div></div><div class="center"><a class="btn" onclick="move(1)">Volgende schoen →</a></div><div class="product-grid" id="chips"></div></main><footer data-footer></footer><script src="supabase-config.js"></script><script src="app.js"></script><script>
let d, list=[],idx=0;
async function init(){d=await loadData();applySite(d);let cats=['Alle',...new Set(d.products.map(p=>p.category))];filters.innerHTML=cats.map(c=>`<button class="filter" onclick="filter('${c.replaceAll("'","\\'")}')">${c}</button>`).join('');filter(new URLSearchParams(location.search).get('cat')||'Alle');}
function filter(c){list=c==='Alle'?d.products:d.products.filter(p=>p.category===c);idx=0;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.textContent===c));render()}
function render(){if(!list.length)return;let p=list[idx];slide.src=p.image;pname.textContent=p.name;pcat.textContent=p.category;count.textContent=(idx+1)+' / '+list.length;chips.innerHTML=list.map((x,i)=>`<div class="product-chip" onclick="idx=${i};render()">${i+1}. ${x.name}</div>`).join('')}
function move(n){idx=(idx+n+list.length)%list.length;render()}init();
</script></body></html>
