<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>De Gouden Stap</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="container nav"><a class="brand" href="index.html"><span class="logo">GS</span><span><strong data-site-name>De Gouden Stap</strong><small data-tagline>STIJL · COMFORT · KWALITEIT</small></span></a><nav class="menu"><a class="active" href="index.html">Home</a><a href="collectie.html">Onze Collectie</a><a href="categorieen.html">Categorieën</a><a href="admin.html">Beheer</a></nav></div></header>
<main id="home"></main><footer data-footer>© De Gouden Stap</footer><script src="supabase-config.js"></script><script src="app.js"></script><script>
(async()=>{const d=await loadData();applySite(d);const h=d.home;document.getElementById('home').innerHTML=`
<section class="hero"><div class="container"><div class="eyebrow" style="color:#fff">${h.eyebrow}</div><h1>${h.title}<em>${h.titleItalic}</em></h1><p>${h.intro}</p><a class="btn" href="collectie.html">Bekijk collectie</a> <a class="btn alt" href="categorieen.html">Ontdek categorieën</a></div></section>
<section class="section center"><div class="container"><div class="eyebrow">ONZE COLLECTIE</div><h2>Onze favoriete stijlen</h2><p class="small">Ontdek een selectie uit onze collectie.</p><div class="cards" id="cards"></div></div></section>
<section class="section"><div class="container split"><div><div class="eyebrow">OVER DE GOUDEN STAP</div><h2>${h.aboutTitle}</h2><p class="small">${h.aboutText}</p><a class="btn" href="collectie.html">Bekijk collectie</a></div><img src="${h.aboutImage}"></div></section>
<section class="section band center"><div class="container"><div class="eyebrow">COMFORT & KWALITEIT</div><h2>${h.detailTitle}</h2><p class="small">${h.detailText}</p><img src="${h.aboutImage}" style="max-width:560px;width:100%;margin-top:20px"></div></section>
<section class="cta"><div class="container"><h2>${h.ctaTitle}</h2><p>${h.ctaText}</p><a class="btn" href="collectie.html">Bekijk de collectie</a></div></section>
<section class="section"><div class="container contact"><div><div class="eyebrow">CONTACT</div><h2>${d.contact.title}</h2><form class="form" onsubmit="event.preventDefault();alert('Bedankt voor je bericht!')"><input placeholder="Naam"><input placeholder="E-mailadres"><textarea placeholder="Bericht"></textarea><button class="btn">Verzenden</button></form></div><div class="contact-box"><h3>Klantenservice</h3><p>Heb je een vraag over onze collectie? Neem contact met ons op.</p><strong>${d.contact.name}</strong><br>${d.contact.address}</div></div></section>`;
document.getElementById('cards').innerHTML=h.cards.map(c=>`<article class="card"><img src="${c.image}"><div class="card-body"><h3>${c.title}</h3><p>${c.text}</p><a class="btn" href="collectie.html">Bekijk stijl</a></div></article>`).join('');
})();</script></body></html>
