<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Categorieën</title><link rel="stylesheet" href="style.css"></head><body><header><div class="container nav"><a class="brand" href="index.html"><span class="logo">GS</span><span><strong data-site-name>De Gouden Stap</strong><small data-tagline></small></span></a><nav class="menu"><a href="index.html">Home</a><a href="collectie.html">Onze Collectie</a><a class="active" href="categorieen.html">Categorieën</a><a href="admin.html">Beheer</a></nav></div></header><section class="pagehead"><div class="container"><div class="eyebrow">CATEGORIEËN</div><h1>Voor ieder moment een stap</h1><p>Kies een categorie en bekijk de collectie.</p></div></section><main class="container"><div class="category-grid" id="cats"></div></main><footer data-footer></footer><script src="supabase-config.js"></script><script src="app.js"></script><script>(async()=>{const d=await loadData();applySite(d);cats.innerHTML=d.categories.map(c=>`<article class="card"><img src="${c.image}"><div class="card-body"><h3>${c.title}</h3><p>${c.text}</p><a class="btn" href="collectie.html?cat=${encodeURIComponent(c.title)}">Bekijk collectie</a></div></article>`).join('')})()</script></body></html>
